<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Water drop over a province map shaded by water access">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1e33"/>
      <stop offset="1" stop-color="#103a5c"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8be3ff"/>
      <stop offset="1" stop-color="#2b8fd6"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- province map -->
  <g stroke="#0b1e33" stroke-width="3" stroke-linejoin="round">
    <path d="M300 70l70-22 60 18 10 52-58 30-64-14z" fill="#f2b56b"/>
    <path d="M440 66l66 10 50 56-14 84-58 20-46-70 12-48z" fill="#f4e19a"/>
    <path d="M318 134l64 14 58-30 12 30-12 48-56 30-70-10-28-46z" fill="#7cc576"/>
    <path d="M286 212l70 10 56-30 46 70-60 40-84 4-46-50z" fill="#5fb36a"/>
    <path d="M498 236l58-20 18 48-46 46-58 4-12-38z" fill="#e3ef9f"/>
  </g>
  <!-- legend -->
  <g transform="translate(590 70)">
    <rect width="14" height="220" rx="7" fill="#d8443a"/>
    <rect width="14" height="160" rx="7" fill="#f2b56b"/>
    <rect width="14" height="100" rx="7" fill="#f4e19a"/>
    <rect width="14" height="50" rx="7" fill="#5fb36a"/>
  </g>
  <!-- ripples -->
  <g fill="none" stroke="#8be3ff" stroke-opacity="0.35" stroke-width="2">
    <ellipse cx="150" cy="300" rx="90" ry="16"/>
    <ellipse cx="150" cy="300" rx="60" ry="10"/>
  </g>
  <!-- drop -->
  <path d="M150 60c40 60 74 104 74 150a74 74 0 0 1-148 0c0-46 34-90 74-150z" fill="url(#drop)"/>
  <path d="M118 196c0-22 10-44 26-68" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="8" stroke-linecap="round"/>
  <text x="150" y="238" text-anchor="middle" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="34" font-weight="700" fill="#0b1e33">46%</text>
</svg>
