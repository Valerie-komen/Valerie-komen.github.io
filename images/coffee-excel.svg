      <rect x="124" y="50" width="42" height="12" rx="3" fill="#21a366"/>
      <rect x="194" y="50" width="62" height="12" rx="3" fill="#21a366"/>
      <rect x="14" y="88" width="64" height="10" rx="3"/><rect x="124" y="88" width="36" height="10" rx="3"/><rect x="194" y="88" width="54" height="10" rx="3"/>
      <rect x="14" y="124" width="80" height="10" rx="3"/><rect x="124" y="124" width="30" height="10" rx="3"/><rect x="194" y="124" width="44" height="10" rx="3"/>
      <rect x="14" y="160" width="56" height="10" rx="3"/><rect x="124" y="160" width="40" height="10" rx="3"/><rect x="194" y="160" width="66" height="10" rx="3"/>
      <rect x="14" y="196" width="72" height="10" rx="3"/><rect x="124" y="196" width="26" height="10" rx="3"/><rect x="194" y="196" width="38" height="10" rx="3"/>
    </g>
