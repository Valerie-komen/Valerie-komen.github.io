      <stop offset="0" stop-color="#0f2a1c"/>
      <stop offset="1" stop-color="#1d4a30"/>
    </linearGradient>
    <g id="bean">
      <ellipse rx="16" ry="11" fill="#7a4526"/>
      <path d="M-13 3c8-8 18-2 26-6" fill="none" stroke="#3a1f10" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- spreadsheet -->
  <g transform="translate(48 56)">
