<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Farm fields at sunrise with a predicted versus actual regression line">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14261a"/>
      <stop offset="1" stop-color="#3d5a2a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#sky)"/>
  <circle cx="470" cy="150" r="110" fill="url(#sun)" opacity="0.6"/>
  <circle cx="470" cy="150" r="34" fill="#ffd27a"/>
  <!-- hills -->
  <path d="M0 210c120-40 240-40 360-10s200 30 280 0V360H0z" fill="#4f7a2f"/>
  <path d="M0 250c140-30 260-20 380 10s180 20 260-6V360H0z" fill="#6b9a38"/>
  <path d="M0 290c160-20 320-10 640 0V360H0z" fill="#88b347"/>
  <!-- crop rows -->
  <g stroke="#3c6324" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <path d="M40 300l60 60M100 296l50 64M160 294l40 66M220 293l30 67M280 292l20 68M340 292l10 68M400 293v67M460 294l-10 66M520 296l-20 64M580 298l-30 62"/>
  </g>
  <g stroke="#2f4f1c" stroke-width="2" opacity="0.5">
    <path d="M60 252l-20 30M120 246l-14 34M180 242l-8 36M240 242l-2 38M300 244l4 36M360 248l10 32"/>
  </g>
  <!-- regression overlay -->
  <g fill="#f3ffe6">
    <circle cx="70" cy="196" r="5"/><circle cx="96" cy="176" r="5"/><circle cx="120" cy="170" r="5"/>
    <circle cx="146" cy="146" r="5"/><circle cx="170" cy="138" r="5"/><circle cx="196" cy="120" r="5"/>
    <circle cx="222" cy="106" r="5"/><circle cx="248" cy="96" r="5"/><circle cx="272" cy="74" r="5"/>
    <circle cx="300" cy="64" r="5"/><circle cx="110" cy="182" r="4"/><circle cx="210" cy="118" r="4"/>
  </g>
  <path d="M56 206L316 50" stroke="#ffd27a" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="60" y="56" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="26" font-weight="700" fill="#f3ffe6">R² 0.96</text>
</svg>
