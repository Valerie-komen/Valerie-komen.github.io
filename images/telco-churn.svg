<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Cell tower signal reaching customers, some of whom are churning">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120f2e"/>
      <stop offset="1" stop-color="#23205a"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- signal arcs -->
  <g fill="none" stroke="#7f8cff" stroke-linecap="round">
    <path d="M128 92a40 40 0 0 1 0-56" stroke-width="4" stroke-opacity="0.8" transform="translate(12 30)"/>
    <path d="M196 92a40 40 0 0 0 0-56" stroke-width="4" stroke-opacity="0.8" transform="translate(-12 30)"/>
    <path d="M108 112a70 70 0 0 1 0-96" stroke-width="4" stroke-opacity="0.5" transform="translate(10 30)"/>
    <path d="M216 112a70 70 0 0 0 0-96" stroke-width="4" stroke-opacity="0.5" transform="translate(-10 30)"/>
  </g>
  <!-- tower -->
  <g stroke="#c9ceff" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M162 94L120 310M162 94l42 216M134 240h56M142 190h40M150 140h24M128 280l62-40M196 280l-62-40"/>
  </g>
  <circle cx="162" cy="88" r="9" fill="#4fd1c5"/>
  <!-- connection lines -->
  <g stroke-width="2" fill="none">
    <path d="M172 92C280 60 360 70 410 100" stroke="#4fd1c5" stroke-opacity="0.6"/>
    <path d="M172 92C290 110 380 150 470 170" stroke="#4fd1c5" stroke-opacity="0.6"/>
    <path d="M172 92C300 160 420 230 540 240" stroke="#ff6b6b" stroke-opacity="0.6" stroke-dasharray="6 6"/>
    <path d="M172 92C280 200 360 270 420 290" stroke="#4fd1c5" stroke-opacity="0.6"/>
    <path d="M172 92C320 70 470 70 560 110" stroke="#ff6b6b" stroke-opacity="0.6" stroke-dasharray="6 6"/>
  </g>
  <!-- customers -->
  <g fill="#4fd1c5">
    <circle cx="420" cy="92" r="11"/><path d="M402 128a18 18 0 0 1 36 0z"/>
    <circle cx="480" cy="162" r="11"/><path d="M462 198a18 18 0 0 1 36 0z"/>
    <circle cx="430" cy="282" r="11"/><path d="M412 318a18 18 0 0 1 36 0z"/>
  </g>
  <g fill="#ff6b6b" opacity="0.75">
    <circle cx="552" cy="232" r="11"/><path d="M534 268a18 18 0 0 1 36 0z"/>
    <circle cx="572" cy="102" r="11"/><path d="M554 138a18 18 0 0 1 36 0z"/>
  </g>
  <g stroke="#ff6b6b" stroke-width="3" stroke-linecap="round">
    <path d="M590 78l12-12M602 78l-12-12"/>
    <path d="M570 208l12-12M582 208l-12-12"/>
  </g>
  <text x="600" y="330" text-anchor="end" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="26" font-weight="700" fill="#e8eaff">AUC 0.845</text>
</svg>
